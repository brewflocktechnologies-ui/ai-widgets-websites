name: Deploy Storybook

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: chatwidget_components_lit

    steps:
      # ----------------------------------------
      # Checkout repository
      # ----------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------
      # Setup Node.js
      # ----------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chatwidget_components_lit/package-lock.json

      # ----------------------------------------
      # Install dependencies
      # ----------------------------------------
      - name: Install dependencies
        run: npm ci

      # ----------------------------------------
      # Build Chat Widget
      # ----------------------------------------
      - name: Build widget
        run: npm run build

      # ----------------------------------------
      # Build Storybook
      # ----------------------------------------
      - name: Build Storybook
        run: npm run build-storybook

      # ----------------------------------------
      # Add test.html to Pages
      # ----------------------------------------
      - name: Add test page
        run: |
          cp test.html storybook-static/test.html

      # ----------------------------------------
      # Add widget dist to Pages
      # ----------------------------------------
      - name: Add widget to Storybook deployment
        run: |
          mkdir -p storybook-static/dist
          cp -r dist/* storybook-static/dist/

      # ----------------------------------------
      # Add client configurations
      # ----------------------------------------
      - name: Add client configurations
        run: |
          if [ -d clients ]; then
            mkdir -p storybook-static/clients
            cp -r clients/* storybook-static/clients/
          fi

      # ----------------------------------------
      # Upload complete Pages artifact
      # ----------------------------------------
      - name: Upload Storybook
        uses: actions/upload-pages-artifact@v3
        with:
          path: chatwidget_components_lit/storybook-static

  # ========================================
  # Deploy to GitHub Pages
  # ========================================
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4