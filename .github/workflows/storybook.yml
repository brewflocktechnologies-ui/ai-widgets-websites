name: Deploy Storybook

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: chatwidget_components_lit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chatwidget_components_lit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build widget
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      # Put the widget build inside the Pages site
      - name: Add widget to Storybook deployment
        run: |
          mkdir -p storybook-static/dist
          cp -r dist/* storybook-static/dist/

      # Optional: publish client JSON files too
      - name: Add client configurations
        run: |
          if [ -d clients ]; then
            mkdir -p storybook-static/clients
            cp -r clients/* storybook-static/clients/
          fi

      - name: Upload Storybook
        uses: actions/upload-pages-artifact@v3
        with:
          path: chatwidget_components_lit/storybook-static

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4