name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build widget + Storybook + Customization
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: chatwidget_components_lit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chatwidget_components_lit/package-lock.json

      - name: Install dependencies (lit)
        run: npm ci

      - name: Build widget (lit)
        run: npm run build

      - name: Build Storybook (lit)
        run: npm run build-storybook

      - name: Install & build customization app
        run: |
          cd ../chatwidget_customization
          npm ci
          npm run build

      - name: Add test page
        run: cp test.html storybook-static/test.html

      - name: Add widget bundle to deployment
        run: |
          mkdir -p storybook-static/dist
          cp -r dist/* storybook-static/dist/
          mkdir -p storybook-static/chatwidget_components_lit/dist
          cp -r dist/* storybook-static/chatwidget_components_lit/dist/

      - name: Add public client configurations
        run: |
          mkdir -p storybook-static/public/clients
          cp -r public/clients/* storybook-static/public/clients/

      - name: Add widget customization app to deployment
        run: |
          mkdir -p storybook-static/chatwidget_customization
          cp -r ../chatwidget_customization/index.html storybook-static/chatwidget_customization/
          cp -r ../chatwidget_customization/forms.html storybook-static/chatwidget_customization/ 2>/dev/null || true
          cp -r ../chatwidget_customization/scripts.js storybook-static/chatwidget_customization/ 2>/dev/null || true
          cp -r ../chatwidget_customization/styles.css storybook-static/chatwidget_customization/ 2>/dev/null || true
          if [ -d "../chatwidget_customization/public" ]; then
            mkdir -p storybook-static/chatwidget_customization/public
            cp -r ../chatwidget_customization/public/* storybook-static/chatwidget_customization/public/ 2>/dev/null || true
          fi
          if [ -d "../chatwidget_customization/dist" ]; then
            cp -r ../chatwidget_customization/dist/* storybook-static/chatwidget_customization/
          fi
          mkdir -p storybook-static/chatwidget_customization/dist
          cp -r dist/* storybook-static/chatwidget_customization/dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: chatwidget_components_lit/storybook-static

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
