name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: chatwidget_components_lit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chatwidget_components_lit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

  build:
    name: Build widget
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: chatwidget_components_lit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chatwidget_components_lit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build widget bundle
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: chatwidget_components_lit/dist
          retention-days: 7

  e2e:
    name: Playwright E2E (all browsers + mobile)
    runs-on: ubuntu-latest
    needs: [unit, build]

    defaults:
      run:
        working-directory: chatwidget_components_lit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chatwidget_components_lit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: chatwidget_components_lit/dist

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('chatwidget_components_lit/package-lock.json') }}

      - name: Install Playwright OS dependencies
        run: npx playwright install-deps

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium firefox webkit

      - name: Run e2e suite (all browsers + mobile)
        env:
          SKIP_BUILD: 'true'
        run: npm run test:e2e:all

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: chatwidget_components_lit/playwright-report
          retention-days: 7

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: chatwidget_components_lit/test-results
          retention-days: 7
