name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests & coverage
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: chatwidget_components_lit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chatwidget_components_lit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Run coverage (100% thresholds enforced by vitest.config.ts)
        run: npm run test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: chatwidget_components_lit/coverage
          retention-days: 7

  build:
    name: Build widget
    runs-on: ubuntu-latest
    needs: unit

    defaults:
      run:
        working-directory: chatwidget_components_lit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chatwidget_components_lit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build widget bundle
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: chatwidget_components_lit/dist
          retention-days: 7

  e2e:
    name: Playwright E2E (all browsers + mobile)
    runs-on: ubuntu-latest
    needs: build

    defaults:
      run:
        working-directory: chatwidget_components_lit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chatwidget_components_lit/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run e2e suite (all browsers + mobile)
        # The playwright webServer builds dist/chat-widget.js and serves it,
        # so tests run against the real shipped bundle via <script data-client-id>.
        run: npm run test:e2e:all

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: chatwidget_components_lit/playwright-report
          retention-days: 7

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: chatwidget_components_lit/test-results
          retention-days: 7
