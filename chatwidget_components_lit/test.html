<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Chat Widget Tester</title>
</head>

<body>

  <h1>Lit Component Client Tester</h1>

  <script
    src="./dist/chat-widget.js"
    data-client-id="amber">
  </script>

  <script>
    document
      .getElementById('dark-mode-button')
      .addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
      });

    document
      .getElementById('widget-button')
      .addEventListener('click', () => {
        window.dispatchEvent(
          new CustomEvent('toggle-contact-widget')
        );
      });
  </script>

</body>
</html>
